name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: rubocop + rspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Latest patch release of the 3.3 series – older patches are not built
          # for the current runner images (see ruby/setup-ruby).
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop
      - name: Run RSpec
        run: bundle exec rspec
